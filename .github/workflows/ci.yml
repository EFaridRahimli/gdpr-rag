name: ci
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # typecheck + build
      - name: committed web/dist is up to date (users run it without Node)
        run: git diff --exit-code -- dist

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uvx --from shellcheck-py shellcheck -s sh install.sh
      - name: retrieval eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::notice::OPENROUTER_API_KEY secret not set (e.g. fork PR), skipping retrieval eval"
            exit 0
          fi
          uv run gdpr-rag ingest
          uv run gdpr-rag eval retrieval --check
