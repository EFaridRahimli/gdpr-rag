[project]
name = "gdpr-rag"
version = "0.1.0"
description = "End-to-end RAG over the GDPR with a privacy-policy compliance checker"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=1.60",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
local-rerank = ["fastembed>=0.7"]  # only for the bake-off's local reranker contender

[project.scripts]
gdpr-rag = "gdpr_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
